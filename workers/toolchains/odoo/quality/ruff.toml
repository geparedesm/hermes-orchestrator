# Default ruff rules of `ho-odoo-lint` for Odoo modules: errors and likely bugs, not formatting. The configuration
# lives in the image so a change cannot relax its own Quality Gate; exceptions are inline (`# noqa: <code>`).
target-version = "py310"
extend-exclude = [".hermes"]

[lint]
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"__manifest__.py" = ["B018"]
