[pytest]
testpaths = tests
addopts = -ra
markers =
    integration: needs PostgreSQL and Redis (HO_TEST_DATABASE_URL, HO_TEST_REDIS_URL)
    docker: needs a Docker daemon and built execution images (HO_TEST_DOCKER=1)
    internet: needs outbound Internet access
    orchestration: build the control plane with the Phase 7 orchestrator enabled
