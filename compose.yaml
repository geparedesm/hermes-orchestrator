# Hermes Orchestrator platform services (ARCHITECTURE.md section 4, NETWORK_MODEL.md section 3).
#
# Services: postgres, redis, migrate (one-shot), control-plane, git-service, agent-manager.
# Phase 9 adds the official Hermes service with the plugin.
# Execution containers (workers, egress proxies) are not Compose services: agent-manager
# creates them on demand from the images pinned in config/images.lock.yaml.
#
# Setup: cp .env.example .env && edit it; make up
name: hermes-orchestrator

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=64m"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ho_owner
      POSTGRES_DB: ho
      POSTGRES_PASSWORD_FILE: /run/secrets/ho_owner_db_password
    secrets: [ho_owner_db_password, ho_app_db_password]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [ho-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ho_owner -d ho"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # Transient coordination only (DATA_MODEL.md section 6): no persistence, reconstructable.
    entrypoint: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$(cat /run/secrets/ho_redis_password)\""]
    secrets: [ho_redis_password]
    networks: [ho-data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/ho_redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: hermes-orchestrator/control-plane:${HO_VERSION:-dev}
    build: {context: ., dockerfile: services/control-plane/Dockerfile}
    <<: *hardening
    restart: "no"
    command: ["ho-migrate"]
    environment:
      HO_DB_OWNER_PASSWORD_FILE: /run/secrets/ho_owner_db_password
    secrets: [ho_owner_db_password]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [ho-data]

  control-plane:
    image: hermes-orchestrator/control-plane:${HO_VERSION:-dev}
    build: {context: ., dockerfile: services/control-plane/Dockerfile}
    <<: *hardening
    environment:
      HO_MACHINE_PROFILE: ${HO_MACHINE_PROFILE:?set HO_MACHINE_PROFILE in .env}
      HO_PROJECTS_ROOT_HOST: ${HO_PROJECTS_ROOT_HOST:?set HO_PROJECTS_ROOT_HOST in .env}
      HO_DB_PASSWORD_FILE: /run/secrets/ho_app_db_password
      HO_REDIS_PASSWORD_FILE: /run/secrets/ho_redis_password
      HO_PLUGIN_TOKEN_FILE: /run/secrets/ho_plugin_token
      HO_OPERATOR_TOKEN_FILE: /run/secrets/ho_operator_token
      HO_GIT_SERVICE_TOKEN_FILE: /run/secrets/ho_git_service_token
      HO_AGENT_MANAGER_URL: http://agent-manager:8082
      HO_AGENT_MANAGER_TOKEN_FILE: /run/secrets/ho_agent_manager_token
      HO_PROVIDER_IDENTITY: ${HO_PROVIDER_IDENTITY:-default}
      HO_ORCHESTRATION: ${HO_ORCHESTRATION:-false}
      HO_INSTANCE_ID: control-plane
      HO_MERGE_KEY_FILE: /run/secrets/ho_merge_key
      HO_LOG_LEVEL: ${HO_LOG_LEVEL:-INFO}
    secrets: [ho_app_db_password, ho_redis_password, ho_plugin_token, ho_operator_token, ho_git_service_token, ho_agent_manager_token, ho_merge_key]
    volumes:
      - ./config:/app/config:ro
      - artifacts:/var/lib/ho/artifacts
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      git-service: {condition: service_healthy}
      agent-manager: {condition: service_healthy}
    networks: [ho-data, ho-control, ho-edge]

  git-service:
    image: hermes-orchestrator/git-service:${HO_VERSION:-dev}
    build: {context: ., dockerfile: services/git-service/Dockerfile}
    <<: *hardening
    environment:
      HO_GIT_SERVICE_TOKEN_FILE: /run/secrets/ho_git_service_token
      HO_MERGE_KEY_FILE: /run/secrets/ho_merge_key
      HO_PROJECTS_ROOT: /projects
      HO_LOG_LEVEL: ${HO_LOG_LEVEL:-INFO}
    secrets: [ho_git_service_token, ho_merge_key]
    volumes:
      # The only read-write mount of the projects root: workspaces, integration refs, approved merges.
      - ${HO_PROJECTS_ROOT_HOST:?set HO_PROJECTS_ROOT_HOST in .env}:/projects
      # GitHub CLI login (make auth-github). Never mounted anywhere else, never backed up.
      - gh-config:/var/lib/ho/gh
    # ho-git-egress reaches GitHub over HTTPS; nothing else is on that network.
    networks: [ho-control, ho-git-egress]

  agent-manager:
    image: hermes-orchestrator/agent-manager:${HO_VERSION:-dev}
    build: {context: ., dockerfile: services/agent-manager/Dockerfile}
    <<: *hardening
    # Non-root; the Docker socket is reachable through its group only.
    # Docker Desktop: group 0. Linux: set HO_DOCKER_GID to the host's docker group ID.
    group_add: ["${HO_DOCKER_GID:-0}"]
    environment:
      HO_MACHINE_PROFILE: ${HO_MACHINE_PROFILE:?set HO_MACHINE_PROFILE in .env}
      HO_PROJECTS_ROOT_HOST: ${HO_PROJECTS_ROOT_HOST:?set HO_PROJECTS_ROOT_HOST in .env}
      HO_PROJECTS_ROOT: /projects
      HO_AGENT_MANAGER_TOKEN_FILE: /run/secrets/ho_agent_manager_token
      HO_PROJECT_SECRETS_DIR: /var/lib/ho/project-secrets
      HO_LOG_LEVEL: ${HO_LOG_LEVEL:-INFO}
    secrets: [ho_agent_manager_token]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/app/config:ro
      # Secrets Broker v1: <project>/<environment>/<NAME> files, outside the projects root.
      # Only Agent Manager reads them, to deliver granted secrets into executions.
      - ${HO_PROJECT_SECRETS_HOST:-./project-secrets}:/var/lib/ho/project-secrets:ro
      # Read-only: used only to validate workspace paths before asking Docker to mount them.
      - ${HO_PROJECTS_ROOT_HOST:?set HO_PROJECTS_ROOT_HOST in .env}:/projects:ro
    networks: [ho-control]

networks:
  ho-data: {internal: true}
  ho-control: {internal: true}
  ho-edge: {internal: true}
  ho-git-egress: {}

volumes:
  pg-data:
  artifacts:
  gh-config:

secrets:
  ho_owner_db_password: {file: ./secrets/ho_owner_db_password}
  ho_app_db_password: {file: ./secrets/ho_app_db_password}
  ho_redis_password: {file: ./secrets/ho_redis_password}
  ho_plugin_token: {file: ./secrets/ho_plugin_token}
  ho_operator_token: {file: ./secrets/ho_operator_token}
  ho_git_service_token: {file: ./secrets/ho_git_service_token}
  ho_agent_manager_token: {file: ./secrets/ho_agent_manager_token}
  ho_merge_key: {file: ./secrets/ho_merge_key}
